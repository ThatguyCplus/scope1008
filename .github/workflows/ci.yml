name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so new CVEs in pinned deps get noticed
  workflow_dispatch:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      # Actions pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: System libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libusb-1.0-0

      - name: Install (hash-checked)
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock

      - name: Lint (pyflakes, bugbear, bandit rules)
        run: python -m ruff check --output-format=github .

      - name: Unit tests
        run: python -m pytest -q

      - name: GUI smoke test (demo backend)
        shell: bash
        run: |
          python tests/gui_smoke.py burst
          python tests/gui_smoke.py roll

      - name: Known-vulnerability scan
        run: python -m pip_audit --strict --progress-spinner off
